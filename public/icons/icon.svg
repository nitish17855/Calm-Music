<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1219"/>
      <stop offset="50%" stop-color="#14232c"/>
      <stop offset="100%" stop-color="#244855"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E64833"/>
      <stop offset="100%" stop-color="#FBE9D0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Wheel Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E64833" stroke-width="20" opacity="0.9"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#FBE9D0" stroke-width="3" opacity="0.4"/>
  
  <!-- Center Hub -->
  <circle cx="256" cy="256" r="64" fill="#070e17" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Mercedes Star in Center -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="#cbd5e1">
    <line x1="256" y1="256" x2="256" y2="204"/>
    <line x1="256" y1="256" x2="211" y2="282"/>
    <line x1="256" y1="256" x2="301" y2="282"/>
  </g>
  
  <!-- Equalizer Ambient Bars at the Bottom -->
  <g fill="url(#glow)" rx="4">
    <rect x="160" y="360" width="12" height="36" rx="6"/>
    <rect x="184" y="340" width="12" height="56" rx="6"/>
    <rect x="208" y="324" width="12" height="72" rx="6"/>
    <rect x="232" y="310" width="12" height="86" rx="6"/>
    <rect x="256" y="300" width="12" height="96" rx="6"/>
    <rect x="280" y="310" width="12" height="86" rx="6"/>
    <rect x="304" y="324" width="12" height="72" rx="6"/>
    <rect x="328" y="340" width="12" height="56" rx="6"/>
    <rect x="352" y="360" width="12" height="36" rx="6"/>
  </g>
</svg>
